<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Background Cloud Glow -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Speed Swoosh Purple -->
    <linearGradient id="speedPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- Orange Gradient for Lower Body -->
    <linearGradient id="trainOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="50%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <!-- Purple Gradient for Upper Body -->
    <linearGradient id="trainPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Clock Sector Orange -->
    <linearGradient id="clockSectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
  </defs>

  <!-- 1. Soft Background Shape -->
  <path d="M 380,120 C 650,80 820,200 800,450 C 780,680 600,780 400,780 C 180,780 80,620 120,420 C 160,200 240,140 380,120 Z" fill="url(#cloudGrad)"/>

  <!-- 2. Purple Motion Wings (Top Right) -->
  <path d="M 580,240 C 680,290 800,400 760,570 C 720,520 680,470 610,400 C 640,460 650,520 620,560 C 580,450 550,350 580,240 Z" fill="url(#speedPurple)" opacity="0.9"/>

  <!-- 3. CLOCK ELEMENT -->
  <g id="ClockBackground">
    <!-- Clock Outer Ring -->
    <circle cx="390" cy="380" r="190" fill="#FFFFFF" stroke="#94A3B8" stroke-width="28"/>
    <!-- Quarter Pie Slice -->
    <path d="M 390,380 L 390,210 A 170,170 0 0,1 560,380 Z" fill="url(#clockSectorGrad)"/>
    <!-- Circular Arrow Track -->
    <path d="M 270,380 A 120,120 0 0,1 380,260" fill="none" stroke="#E2E8F0" stroke-width="26" stroke-linecap="round"/>
    <polygon points="360,230 405,260 370,290" fill="#E2E8F0"/>
    <!-- Clock Hands -->
    <line x1="390" y1="380" x2="390" y2="250" stroke="#EF4444" stroke-width="14" stroke-linecap="round"/>
    <line x1="390" y1="380" x2="300" y2="470" stroke="#EF4444" stroke-width="14" stroke-linecap="round"/>
    <circle cx="390" cy="380" r="12" fill="#EF4444"/>
  </g>

  <!-- 4. Purple Speed Streaks (Bottom Ground) -->
  <path d="M 170,640 C 300,640 540,730 630,750 C 500,780 280,770 160,690 C 150,660 155,640 170,640 Z" fill="url(#speedPurple)" opacity="0.85"/>

  <!-- 5. BULLET TRAIN (Accurate High-Speed Silhouette) -->
  <g id="CrispBulletTrain">
    <!-- Dark Underbody / Track Base -->
    <path d="M 130,550 L 330,600 L 730,735 L 750,715 L 710,670 L 330,560 L 130,515 Z" fill="#1E1B4B"/>

    <!-- Main Lower Body (Vibrant Orange) -->
    <path d="M 130,510 L 330,555 L 710,665 C 750,650 780,610 750,560 C 670,470 540,465 440,475 L 330,490 L 130,455 Z" fill="url(#trainOrangeGrad)"/>

    <!-- Yellow Nose Tip / Aerodynamic Front Cowling -->
    <path d="M 710,665 C 750,650 780,610 750,560 C 720,530 680,520 630,530 C 690,565 710,615 710,665 Z" fill="#FACC15"/>
    <path d="M 740,630 C 765,600 755,565 730,545 C 715,565 715,600 740,630 Z" fill="#FDE047"/>

    <!-- Upper Roof & Cabin (Purple Tone) -->
    <path d="M 130,455 L 330,490 L 440,475 C 540,465 670,470 710,540 C 660,505 580,490 490,495 L 330,515 L 130,480 Z" fill="url(#trainPurpleGrad)"/>

    <!-- Front Windshield Glass (Dark Cockpit Visor) -->
    <path d="M 540,495 C 600,500 660,530 690,560 C 665,565 620,545 560,525 Z" fill="#0F172A"/>

    <!-- Headlight Slit (Sharp Neon Glow) -->
    <path d="M 640,585 C 670,605 700,620 720,625 C 700,615 675,600 650,580 Z" fill="#1E1B4B"/>

    <!-- Coach Divider Line -->
    <line x1="330" y1="490" x2="330" y2="595" stroke="#1E1B4B" stroke-width="8" stroke-linecap="round"/>

    <!-- Side Passenger Windows (Coach 1) -->
    <g fill="#1E1B4B">
      <rect x="160" y="475" width="22" height="30" rx="4" transform="skewY(7)"/>
      <rect x="195" y="480" width="22" height="30" rx="4" transform="skewY(7)"/>
      <rect x="230" y="485" width="22" height="30" rx="4" transform="skewY(7)"/>
      <rect x="265" y="490" width="22" height="30" rx="4" transform="skewY(7)"/>
    </g>

    <!-- Side Passenger Windows (Coach 2 - Front) -->
    <g fill="#1E1B4B">
      <rect x="360" y="503" width="28" height="30" rx="4" transform="skewY(7)"/>
      <rect x="405" y="509" width="28" height="30" rx="4" transform="skewY(7)"/>
      <rect x="450" y="515" width="28" height="30" rx="4" transform="skewY(7)"/>
    </g>
  </g>
</svg>
