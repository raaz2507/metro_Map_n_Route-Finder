<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>⚡ High-Performance 2.5D Canvas Metro Map (Prototype)</title>
	
	<!-- Shared Base Design Tokens -->
	<link rel="stylesheet" href="../css/base/base.css">
	<link rel="stylesheet" href="./canvas-map.css">
</head>
<body class="canvas-testbed">
	<!-- Top Diagnostic Toolbar -->
	<header class="testbed-toolbar">
		<div class="toolbar-brand">
			<span class="pulse-dot"></span>
			<strong>Metro Canvas 2.5D Engine</strong>
			<span class="badge" id="fpsBadge">60 FPS</span>
		</div>
		<div class="toolbar-stats">
			<span id="stationCountBadge">Stations: --</span>
			<span id="zoomLevelBadge">Zoom: 100%</span>
			<span id="modeBadge">Mode: 2D</span>
		</div>
	</header>

	<!-- Main Map Viewport -->
	<main class="testbed-main">
		<div class="map-card-wrapper">
			<div id="mapContainer" class="canvas-map-container">
				<!-- Canvas will be dynamically injected here -->
			</div>

			<!-- Floating Zoom & 2.5D Mode Controls -->
			<div class="canvas-zoom-controls" id="canvasZoomControls">
				<output id="zoomOutput">100%</output>
				<button type="button" id="btnZoomIn" title="Zoom In">+</button>
				<button type="button" id="btnZoomOut" title="Zoom Out">−</button>
				<button type="button" id="btnResetZoom" title="Reset View">=</button>
				<button type="button" id="btnToggle25D" class="mode-toggle-btn" title="Toggle 2.5D Flight Deck">2.5D</button>
			</div>

			<!-- Station Hover / Click Info Tooltip -->
			<div id="canvasTooltip" class="canvas-station-tooltip" hidden>
				<div class="tooltip-header">
					<strong id="tooltipStationName">Station Name</strong>
					<span id="tooltipLayoutBadge" class="layout-badge">Elevated</span>
				</div>
				<div class="tooltip-body">
					<span id="tooltipLines">Lines: Red, Blue</span>
					<span id="tooltipStatus" class="status-badge">Operational</span>
				</div>
			</div>
		</div>
	</main>

	<!-- Main Testbed Module -->
	<script type="module" src="./canvas-app.js"></script>
</body>
</html>
