<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
	<!-- Dark Synthwave Grid Background -->
	<linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
	  <stop offset="0%" stop-color="#05010d" />
	  <stop offset="55%" stop-color="#0d041e" />
	  <stop offset="80%" stop-color="#240738" />
	  <stop offset="100%" stop-color="#05010d" />
	</linearGradient>

	<!-- Neon Horizon Glow -->
	<radialGradient id="neonSun" cx="50%" cy="75%" r="45%">
	  <stop offset="0%" stop-color="#ff007f" stop-opacity="0.35" />
	  <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.12" />
	  <stop offset="100%" stop-color="#05010d" stop-opacity="0" />
	</radialGradient>

	<!-- Perspective Grid Pattern -->
	<pattern id="hudHex" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
	  <path d="M 30,0 L 60,17.32 L 60,51.96 L 30,69.28 L 0,51.96 L 0,17.32 Z" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.1" />
	  <path d="M 30,69.28 L 60,86.6 L 60,121.24 L 30,138.56 L 0,121.24 L 0,86.6 Z" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.1" />
	</pattern>
  </defs>

  <!-- Deep Obsidian Space Canvas -->
  <rect width="1080" height="1920" fill="url(#cyberSky)" />

  <!-- Neon Sun / Horizon Glow -->
  <rect width="1080" height="1920" fill="url(#neonSun)" />

  <!-- Subtle Cyber HUD Hex Grid -->
  <rect width="1080" height="1920" fill="url(#hudHex)" />

  <!-- ── 3D PERSPECTIVE SYNTHWAVE GRID (Bottom Floor) ── -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.25">
	<!-- Horizontal Perspective Lines -->
	<line x1="0" y1="1400" x2="1080" y2="1400" />
	<line x1="0" y1="1480" x2="1080" y2="1480" stroke-width="1.8" />
	<line x1="0" y1="1580" x2="1080" y2="1580" stroke-width="2.2" />
	<line x1="0" y1="1710" x2="1080" y2="1710" stroke-width="2.8" />
	<line x1="0" y1="1870" x2="1080" y2="1870" stroke-width="3.5" />

	<!-- Vanishing Point Lines converging to center (540, 1340) -->
	<line x1="540" y1="1340" x2="-200" y2="1920" />
	<line x1="540" y1="1340" x2="0" y2="1920" />
	<line x1="540" y1="1340" x2="200" y2="1920" />
	<line x1="540" y1="1340" x2="380" y2="1920" />
	<line x1="540" y1="1340" x2="540" y2="1920" stroke="#ff007f" stroke-width="2.5" opacity="0.5" />
	<line x1="540" y1="1340" x2="700" y2="1920" />
	<line x1="540" y1="1340" x2="880" y2="1920" />
	<line x1="540" y1="1340" x2="1080" y2="1920" />
	<line x1="540" y1="1340" x2="1280" y2="1920" />
  </g>

  <!-- ── TOP HUD TELEMETRY ACCENTS (Corner Targeting Brackets) ── -->
  <!-- Top Left Target Bracket -->
  <g stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.6">
	<path d="M 40 100 L 40 40 L 100 40" />
	<circle cx="40" cy="40" r="3" fill="#ff007f" />
	<text x="50" y="65" fill="#00f0ff" font-family="monospace" font-size="11" letter-spacing="2">SYS.2077 // ONLINE</text>
  </g>

  <!-- Top Right Neon Cyan Crosshair -->
  <g stroke="#ff007f" stroke-width="2" fill="none" opacity="0.5">
	<path d="M 1040 100 L 1040 40 L 980 40" />
	<circle cx="1040" cy="40" r="3" fill="#00f0ff" />
	<line x1="1010" y1="70" x2="1030" y2="70" stroke="#00f0ff" stroke-width="1.5" />
	<line x1="1020" y1="60" x2="1020" y2="80" stroke="#00f0ff" stroke-width="1.5" />
  </g>
</svg>
