<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Ben-Day Halftone Dot Pattern (Classic Vintage Comics) -->
    <pattern id="bendedDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#ef4444" opacity="0.14" />
      <circle cx="14" cy="14" r="2.2" fill="#facc15" opacity="0.16" />
    </pattern>

    <!-- Micro Inked Stippling Grid -->
    <pattern id="inkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#111111" opacity="0.06" />
    </pattern>
  </defs>

  <!-- Warm Aged Newsprint Paper Canvas -->
  <rect width="1080" height="1920" fill="#fffde7" />

  <!-- Ben-Day Dots Texture Layer -->
  <rect width="1080" height="1920" fill="url(#bendedDots)" />
  <rect width="1080" height="1920" fill="url(#inkGrid)" />

  <!-- ── COMIC BOOK ACTION SUNBURST / ACTION RAYS (Top & Bottom Ambient) ── -->
  <!-- Subtle Action Rays radiating from Top Center -->
  <g fill="#facc15" opacity="0.18">
    <polygon points="540, -50 490, 400 590, 400" />
    <polygon points="540, -50 300, 350 400, 380" />
    <polygon points="540, -50 680, 380 780, 350" />
    <polygon points="540, -50 120, 260 200, 320" />
    <polygon points="540, -50 880, 320 960, 260" />
    <polygon points="540, -50 -20, 160 50, 230" />
    <polygon points="540, -50 1030, 230 1100, 160" />
  </g>

  <!-- ── VINTAGE INKED COMIC PANEL FRAMES & CORNER BLOBS ── -->
  <!-- Top Right Inked Panel Border Fragment -->
  <path d="M 820 -20 L 1100 -20 L 1100 260 L 980 260 Z" fill="#ffe4e6" opacity="0.6" stroke="#000000" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Bottom Left Inked Comic Starburst Accent -->
  <g transform="translate(140, 1720)" stroke="#000000" stroke-width="3.5" fill="#fef08a" opacity="0.85">
    <path d="M 0 -70 L 22 -22 L 70 0 L 22 22 L 0 70 L -22 22 L -70 0 L -22 -22 Z" />
  </g>

  <!-- Bottom Right Action Speed Lines -->
  <g stroke="#000000" stroke-width="3" stroke-linecap="round" opacity="0.15">
    <line x1="880" y1="1840" x2="1040" y2="1840" />
    <line x1="920" y1="1860" x2="1060" y2="1860" />
    <line x1="850" y1="1880" x2="1020" y2="1880" />
    <line x1="900" y1="1900" x2="1050" y2="1900" />
  </g>

  <!-- Top Left Dynamic Comic Sound Effect 'POW' Star (Ghost Watermark) -->
  <path d="M 40,60 L 70,80 L 110,65 L 105,100 L 140,120 L 105,140 L 110,175 L 75,160 L 45,185 L 50,150 L 15,130 L 50,110 Z" 
        fill="#fef08a" opacity="0.4" stroke="#000000" stroke-width="3" />
</svg>
