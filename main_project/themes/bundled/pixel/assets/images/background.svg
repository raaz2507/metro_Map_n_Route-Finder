<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <defs>
	<!-- Stepped 8-Bit Pixel Checker Pattern -->
	<pattern id="arcadeGrid" width="32" height="32" patternUnits="userSpaceOnUse">
	  <rect x="0" y="0" width="16" height="16" fill="#1535a1" opacity="0.12" />
	  <rect x="16" y="16" width="16" height="16" fill="#1535a1" opacity="0.12" />
	  <rect x="16" y="0" width="16" height="16" fill="#30cef0" opacity="0.04" />
	  <rect x="0" y="16" width="16" height="16" fill="#30cef0" opacity="0.04" />
	</pattern>

	<!-- Scanline Dither Pattern -->
	<pattern id="pixelScanlines" width="4" height="4" patternUnits="userSpaceOnUse">
	  <rect x="0" y="2" width="4" height="2" fill="#000000" opacity="0.12" />
	</pattern>
  </defs>

  <!-- Deep Arcade Midnight Slate Canvas (Like pixlate_degine.html #08081a) -->
  <rect width="1080" height="1920" fill="#0c1224" />

  <!-- Checkerboard Grid -->
  <rect width="1080" height="1920" fill="url(#arcadeGrid)" />
  <rect width="1080" height="1920" fill="url(#pixelScanlines)" />

  <!-- ── 8-BIT RETRO INVADER PIXEL ICONS (Top Left & Top Right Watermarks) ── -->
  <!-- Top Left Pixel Invader (Electric Cyan #30cef0) -->
  <g transform="translate(60, 60)" fill="#30cef0" opacity="0.35">
	<rect x="24" y="0" width="8" height="8" />
	<rect x="56" y="0" width="8" height="8" />
	<rect x="32" y="8" width="8" height="8" />
	<rect x="48" y="8" width="8" height="8" />
	<rect x="24" y="16" width="40" height="8" />
	<rect x="16" y="24" width="16" height="8" />
	<rect x="40" y="24" width="8" height="8" />
	<rect x="56" y="24" width="16" height="8" />
	<rect x="8" y="32" width="72" height="8" />
	<rect x="8" y="40" width="8" height="8" />
	<rect x="24" y="40" width="40" height="8" />
	<rect x="72" y="40" width="8" height="8" />
	<rect x="8" y="48" width="8" height="8" />
	<rect x="24" y="48" width="8" height="8" />
	<rect x="56" y="48" width="8" height="8" />
	<rect x="72" y="48" width="8" height="8" />
	<rect x="24" y="56" width="16" height="8" />
	<rect x="48" y="56" width="16" height="8" />
  </g>

  <!-- Top Right Pixel Star / Coin (Arcade Gold #e8b84d) -->
  <g transform="translate(940, 60)" fill="#e8b84d" opacity="0.4">
	<rect x="24" y="0" width="16" height="8" />
	<rect x="16" y="8" width="32" height="8" />
	<rect x="8" y="16" width="48" height="8" />
	<rect x="8" y="24" width="48" height="8" />
	<rect x="16" y="32" width="32" height="8" />
	<rect x="24" y="40" width="16" height="8" />
  </g>

  <!-- ── BOTTOM PIXEL CITY / MOUNTAIN HORIZON (Stepped 16px Blocks) ── -->
  <g fill="#1535a1" opacity="0.3">
	<!-- Stepped Skyline Silhouette -->
	<rect x="0" y="1840" width="120" height="80" />
	<rect x="120" y="1800" width="80" height="120" />
	<rect x="200" y="1760" width="100" height="160" />
	<rect x="300" y="1820" width="140" height="100" />
	<rect x="440" y="1740" width="90" height="180" />
	<rect x="530" y="1780" width="110" height="140" />
	<rect x="640" y="1810" width="130" height="110" />
	<rect x="770" y="1750" width="100" height="170" />
	<rect x="870" y="1790" width="90" height="130" />
	<rect x="960" y="1830" width="120" height="90" />
  </g>

  <!-- Ground Pixel Strip -->
  <rect x="0" y="1900" width="1080" height="20" fill="#30cef0" opacity="0.5" />
</svg>
