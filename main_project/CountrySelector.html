<!DOCTYPE html>
<html lang="en">
<head>
	<!-- [METADATA_START] -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

	<!-- Open Graph / Social Sharing -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/CountrySelector.html">
	<meta property="og:title" content="Select Country & Global Regions | YatraMarg">
	<meta property="og:description" content="Choose your country to access localized high-speed transit maps, fare structures, and multi-modal route guidance.">
	<meta property="og:image" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/assets/images/share_image_com.png">

	<!-- Twitter / X Cards -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:url" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/CountrySelector.html">
	<meta name="twitter:title" content="Select Country & Global Regions | YatraMarg">
	<meta name="twitter:description" content="Choose your country to access localized high-speed transit maps, fare structures, and multi-modal route guidance.">
	<meta name="twitter:image" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/assets/images/share_image_com.png">

	<!-- Favicon & PWA App Standards -->
	<link rel="icon" type="image/svg+xml" href="assets/images/site_icon.svg">
	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#0f172a">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

	<title data-i18n="pages.country.pageTitle">Select Country & Global Regions | YatraMarg</title>

	<!-- 🎯 Single CSS Entry Point Architecture -->
	<link rel="stylesheet" href="css/pages/country_selector.css">
	<!-- [METADATA_END] -->
</head>
<body>

	<!-- 1. Universal Header Container -->
	<div id="app-header"></div>

	<!-- 2. Main Page Container (Transparent Canvas) -->
	<main class="country-selector-page">
		
		<!-- 🌍 HERO / HEADER BANNER -->
		<section class="country-hero-deck">
			<div class="hero-badge">
				<span class="ui-vector-icon icon-globe" aria-hidden="true"></span>
				<span data-i18n="pages.countrySelector.hero.badge">Global Transit Directory</span>
			</div>
			<h1 data-i18n="pages.countrySelector.hero.title">Choose Country & Transit Region</h1>
			<p data-i18n="pages.countrySelector.hero.desc">Explore high-speed rail, suburban metro lines, and urban networks worldwide. Select your destination to continue.</p>
		</section>

		<!-- 🎛️ SEARCH & STATUS FILTER DECK -->
		<section class="country-controls-deck" data-i18n-aria-label="pages.countrySelector.aria.filterControls" aria-label="Search and Filter Countries">
			<div class="search-box-wrapper">
				<span class="search-icon" aria-hidden="true">🔍</span>
				<input 
					type="text" 
					id="country-search-input" 
					placeholder="Search country or code (e.g. India, Japan, UK, FR)..." 
					data-i18n-placeholder="pages.countrySelector.search.placeholder"
					data-i18n-aria-label="pages.countrySelector.search.aria"
					aria-label="Search country"
					autocomplete="off"
				>
				<button type="button" id="clear-country-search-btn" class="clear-btn" data-i18n-aria-label="pages.countrySelector.search.clearAria" aria-label="Clear Search" hidden>✕</button>
			</div>

			<!-- Filter Chips (Active vs Upcoming) -->
			<div class="filters-row">
				<div class="filter-group">
					<span class="filter-label" data-i18n="pages.countrySelector.filters.statusLabel">Status:</span>
					<div class="filter-chips-wrapper" id="country-status-chips" role="radiogroup" data-i18n-aria-label="pages.countrySelector.aria.filterStatus" aria-label="Filter by Country Status">
						<button type="button" class="chip-btn active" data-status="all" aria-checked="true"><span class="ui-vector-icon icon-all-status"></span> <span data-i18n="pages.countrySelector.filters.all">All Countries</span></button>
						<button type="button" class="chip-btn" data-status="active" aria-checked="false"><span class="ui-vector-icon icon-status-operational"></span> <span data-i18n="pages.countrySelector.filters.operational">Operational</span></button>
						<button type="button" class="chip-btn" data-status="upcoming" aria-checked="false"><span class="ui-vector-icon icon-status-partial"></span> <span data-i18n="pages.countrySelector.filters.upcoming">Upcoming</span></button>
					</div>
				</div>
			</div>
		</section>

		<!-- 📊 STATS SUMMARY BAR -->
		<section class="results-stats-bar" aria-live="polite">
			<span id="country-stats-counter-text" data-i18n="pages.countrySelector.stats.loading">Loading Countries Manifest...</span>
		</section>

		<!-- 🌐 DYNAMIC COUNTRIES GRID CONTAINER -->
		<div id="country-grid-container" class="country-grid-container" data-i18n-aria-label="pages.countrySelector.aria.countriesList" aria-label="Countries Directory">
			<div class="loading-state">
				<div class="spinner" aria-hidden="true"></div>
				<p data-i18n="pages.countrySelector.stats.loading">Loading Global Transit Directory...</p>
			</div>
		</div>

	</main>

	<!-- 3. Universal Footer Container -->
	<div id="app-footer"></div>

	<!-- 4. Page Script Module -->
	<script type="module" src="js/pages/country_selector.js"></script>
</body>
</html>
