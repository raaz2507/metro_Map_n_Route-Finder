<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="230" height="230">
  <defs>
    <!-- Single lightweight blur filter for smooth blending -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <!-- Arch Shape ClipPath -->
    <clipPath id="archShape">
      <path d="M89.7 93.7c4.67 3.5 11.67 1.17 5.25-5.25C75.7 69.78 79.78 18.45 55.87 18.45c-23.92 0-19.84 51.33-39.09 70-7 7 .58 8.75 5.25 5.25 18.09-12.25 16.92-33.84 33.84-33.84 16.91 0 15.75 21.59 33.83 33.84z" />
    </clipPath>
  </defs>

  <g clip-path="url(#archShape)">
    <!-- Base Blue Layer -->
    <rect width="100" height="100" fill="#3186FF" />

    <!-- Color Spots inside one single blurred group -->
    <g filter="url(#softGlow)">
      <!-- Left Side: Green Ribbon Flow -->
      <ellipse cx="18" cy="52" rx="22" ry="32" fill="#00B95C" />
      
      <!-- Top Center to Left: Vibrant Yellow Peak -->
      <ellipse cx="40" cy="22" rx="20" ry="16" fill="#FBBC04" />
      <circle cx="28" cy="30" r="14" fill="#FFEE48" />

      <!-- Top Right: Rich Red Curve -->
      <ellipse cx="78" cy="28" rx="26" ry="24" fill="#FC413D" />

      <!-- Right Bottom Soft Blue / Cyan Fill -->
      <ellipse cx="80" cy="85" rx="20" ry="20" fill="#3186FF" />
    </g>
  </g>
</svg>
