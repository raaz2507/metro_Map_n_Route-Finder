  <rect x="28" y="68" width="8" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="64" y="50" width="8" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="64" y="68" width="8" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
