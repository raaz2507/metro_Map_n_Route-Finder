  <path d="M 40 84 V 60 Q 50 48 60 60 V 84 Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <path d="M 44 84 V 66 Q 50 56 56 66 V 84 Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Side Arches Left & Right -->
