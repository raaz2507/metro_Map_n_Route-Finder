<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <!-- Base Plinth -->
  <rect x="5" y="88" width="90" height="6" rx="1"/>
  <rect x="10" y="84" width="80" height="4" rx="1"/>
  <!-- Central Mausoleum Block -->
  <rect x="25" y="44" width="50" height="40" rx="1"/>
