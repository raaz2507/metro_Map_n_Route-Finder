<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- Open Graph / Facebook / WhatsApp / Telegram -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/">
	<meta property="og:title" content="Metro Map & Route Finder">
	<meta property="og:description" content="Find the best metro routes, ticket fares, travel time, and intermediate stations easily.">
	<meta property="og:image" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/assets/images/share_image_com.png"> 

	<!-- Twitter / X -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:url" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/">
	<meta name="twitter:title" content="Metro Map & Route Finder">
	<meta name="twitter:description" content="Find the best metro routes, ticket fares, travel time, and intermediate stations easily.">
	<meta name="twitter:image" content="https://raaz2507.github.io/metro_Map_n_Route-Finder/assets/images/share_image_com.png">
    
    <!-- Site Icon / Favicon -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/site_icon.svg">
    <title>All Stations Directory - Template 2 (Coach Grid Layout)</title>

    <!-- Pre-written App Stylesheet -->
    <link rel="stylesheet" href="./css/pages/all_stations.css"/>
    
</head>
<body>

     <!-- 1. Universal Header Container -->
    <div id="app-header"></div>
    

    <main class="stations-page-container">
        <!-- Controls Area -->
        <section class="directory-controls">
            <div class="search-box-wrapper">
                <span>🔍</span>
                <input type="text" id="dir-search-input" placeholder="Search station by name or code (e.g. Jhilmil, Rajiv Chowk)...">
            </div>
            <!-- Dynamic Line Filter Chips -->
            <div class="filter-chips-wrapper" id="filter-chips-wrapper">
                <button class="chip-btn active" data-line="all">All Lines</button>
            </div>
        </section>
        <!-- Dynamic Container where JS Class will render Line Sections & Coach Tracks -->
        <div id="stations-directory-container">
            <!-- Dynamic Line Sections & Track Rows will be rendered here by js/all_stations.js -->
        </div>
    </main>
    
    <!-- 2. Universal Footer Container -->
    <div id="app-footer"></div>
    <!-- 3. Page Script Module -->
    <script type="module" src="./js/pages/all_stations.js"></script>
    
</body>
</html>
