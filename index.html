<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Map Generator</title>
    <link rel="stylesheet" href="./css/style.css"/>
    <style></style>
</head>

<body>
    <header>
        <h1>Metro Map Generator</h1>
        <div class="themeSelector">
            <label for="theme">Theme:</label>
            <select name="theme" id="theme">
                <!-- 
                    क्लासिक लाइट थीम (Classic Light):
                    यह मैप की डिफ़ॉल्ट थीम है। इसमें बैकग्राउंड को साफ सफेद या हल्के ऑफ-व्हाइट रंग में रखा जाता है, 
                    जो दिन के उजाले में पढ़ने के लिए सबसे उपयुक्त है। सभी मेट्रो लाइन के रंग और स्टेशन के नाम 
                    इसमें पूरी स्पष्टता और हाई कंट्रास्ट के साथ दिखाई देते हैं।
                -->
                <option value="light">Classic Light</option>

                <!-- 
                    स्लीक डार्क थीम (Sleek Dark):
                    यह डार्क मोड पसंद करने वालों के लिए है। इसमें बैकग्राउंड को गहरे स्लेटी (dark slate) या मिडनाइट ब्लू में 
                    रखा जाता है, जिससे कम रोशनी या रात के समय आंखों पर खिंचाव और थकान नहीं होती। मेट्रो की चमकीली रंगीन लाइनें 
                    इस गहरे बैकग्राउंड पर काफी खूबसूरत और साफ दिखाई देती हैं।
                -->
                <option value="dark">Sleek Dark</option>

                <!-- 
                    नियॉन साइबरपंक थीम (Neon Cyberpunk):
                    यह एक हाई-टेक और फ्यूचरिस्टिक थीम है। इसमें बैकग्राउंड बिल्कुल जेट-ब्लैक (पूर्ण काला) होता है, 
                    और सभी मेट्रो लाइन्स को चमकीले नियॉन (glow neon) कलर्स जैसे नियॉन पिंक, नियॉन ग्रीन और स्यान में 
                    दिखाया जाता है। यह पूरे मैप को एक मॉडर्न साइंस-फिक्शन गेम जैसा लुक देता है।
                -->
                <option value="cyberpunk">Neon Cyberpunk</option>

                <!-- 
                    विंटेज रेट्रो थीम (Vintage Retro):
                    यह थीम पुराने समय के ऐतिहासिक रेलवे और सबवे मैप्स की याद दिलाती है। इसमें बैकग्राउंड को मटमैले पीले या 
                    सेपिया (sepia/warm beige) टोन में रखा जाता है। लाइन के रंगों को भी थोड़ा मद्धम (muted/earth tones) 
                    किया जाता है, जो 1980 के दशक का एक क्लासिक और विंटेज अनुभव प्रदान करता है।
                -->
                <option value="vintage">Vintage Retro</option>

                <!-- 
                    फॉरेस्ट मिंट थीम (Forest Mint):
                    यह प्रकृति से प्रेरित एक बहुत ही शांत थीम है। इसमें बैकग्राउंड को हल्के मिंट ग्रीन (सॉफ्ट पुदीना हरा) 
                    रंग में रखा जाता है। यह थीम उन लोगों के लिए है जिन्हें बहुत ही सॉफ्ट, पेस्टल और आरामदायक विजुअल्स 
                    पसंद हैं, जो आंखों को बहुत ही तरोताजा और शांतिपूर्ण महसूस कराते हैं।
                -->
                <option value="mint">Forest Mint</option>

                <!-- 
                    जिब्ली नॉस्टैल्जिया थीम (Ghibli Nostalgia):
                    यह प्रसिद्ध स्टूडियो जिब्ली (Studio Ghibli) की एनिमेटेड फिल्मों के दृश्यों से प्रेरित है। इसका बैकग्राउंड 
                    हल्का गर्म क्रीम (warm cream/ivory) रंग का होता है। इसमें लाइन्स और टेक्स्ट को हाथ से पेंट किए गए 
                    पेस्टल वॉटरकलर शेड्स का लुक दिया जाता है, जो पूरे मैप को जादुई और हाथ से बना हुआ (hand-drawn) फील देता है।
                -->
                <option value="ghibli">Ghibli Nostalgia</option>
            </select>
        </div>
        <div>
            <label for="language">Lang:</label>
            <select id="language" name="lang">
                <option value="en">Eng</option>
                <option value="hi" >हिन्दी</option>
            </select>
        </div>
    </header>
    
    <main>
        <aside>
            <form action="" method="post" class="routeFinder">
                <fieldset>
                    <legend>Route Finder</legend>
                    <label for="startStation">From</label>
                    <input type="text" id="startStation" placeholder="Enter start station" list="stationList">
                    <button type="button" id="swapButton">&#8644;</button>
                    <label for="endStation">To</label>
                    <input type="text" id="endStation" placeholder="Enter end station" list="stationList">
                    <datalist id="stationList"></datalist>
                    <p>Priority:</p>
                    <label><input type="radio" name="routeType" value="fastest" checked> Shortest</label>
                    <label><input type="radio" name="routeType" value="leastTransfers"> Less Interchange</label>
                    <br>
                    <input type="reset" value="Reset">
                    <input type="submit" value="Find Route">
                </fieldset>
            </form>
            <div id="journeyDetails">
                <section class="quickoverview">
                    <div class="total_station"><span class="value">00</span>stations</div>
                    <div class="time"><span class="value">00</span>min</div>
                    <div class="fare_amount"><span class="value">00</span>Rs</div>
                    <div class="interchange_count"><span class="value">00</span>Interchange</div>
                    <div class="distance"><span class="value">00</span> Km</div>
                </section>
                <section class="route-overview">
                    
                </section>
            </div>
        </aside>
        <section class="map-section">
            <div class="mapContainer"></div>
            <div class="legend-panel">
                <h2>Legend</h2>
                <div class="legend-section">
                    <h3>Metro Track Lines</h3>
                    <ul id="track_line_legend"></ul>
                </div>
                <div class="legend-section">
                    <h3>Station Type</h3>
                    <ul id="station_type_legend"></ul>
                </div>
                
            </div>
            <div id="zoomControls">
                <output name="zoomLevel" id="zoomLevel" for="zoomInBtn zoomOutBtn resetZoomBtn">00%</output>
                <button id="zoomInBtn">+</button>
                <button id="zoomOutBtn">-</button>
                <button id="resetZoomBtn">=</button>
            </div>
        </section>
        
    </main>
    
    <footer>
        <p>&copy; 2024 Metro Map Generator. All rights reserved.</p>    
    </footer>
</body>
<script type="module" src="./js/script.js">

</script>
</html>
