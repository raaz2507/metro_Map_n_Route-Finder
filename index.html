					</li>
					<li class="sidebar-nav-item">
						<button type="button" class="sidebar-link" data-target="route-finder" aria-controls="route-finder" aria-selected="false">
							<span class="route-icon icon" aria-hidden="true"></span>
							<span data-i18n="home.routeFinder">Route</span>
						</button>
					</li>
					<li class="sidebar-nav-item">

				<section id="recent-searches" aria-labelledby="recent-searches-heading" class="sidebar-section">

					<header class="section-header recent-header">
						<h2 id="recent-searches-heading" data-i18n="pages.home.sidebar.recent.recentSearches">Recent Searches</h2>

					</header>

					<!-- Search History -->
					<div class="recent-search-list-container">
						<div class="filter-chips">
							<button type="button" class="active" data-i18n="pages.home.sidebar.recent.recent">Recent</button>
							<button type="button" data-i18n="pages.home.sidebar.recent.mostUsed">Most Used</button>
							<button type="button" data-i18n="pages.home.sidebar.recent.az">A-Z</button>

						<ul id="recent-search-list">
							<li class="recent-list-empty"> No recent journeys found </li >

						</ul>

				<section id="route-finder" class="route-finder-section sidebar-section" aria-labelledby="route-finder-heading">
					<form action="" method="post" class="routeFinder">
						<!-- <h2 id="route-finder-heading" data-i18n="home.routeFinder">Route Finder</h2> -->
						<fieldset>
							<legend id="route-finder-heading" data-i18n="pages.home.sidebar.findroute.routeFinder">Route Finder</legend>

							<!-- <legend>Route Finder</legend> -->
							<!-- Start Station -->
							<div class="form-group">
								<label for="startStation" data-i18n="pages.home.sidebar.findroute.startStation">From</label>
								<input type="text" id="startStation" data-i18n-placeholder="pages.home.sidebar.findroute.startPlaceholder" placeholder="Enter start station" list="stationList" value="Badarpur Border" autocomplete="off" required>
							</div>
							
							<!-- Swap Button -->
							<button type="button" id="swapButton" aria-label="Swap stations" data-i18n-title="pages.home.sidebar.findroute.swapStations" title="Swap stations">
								<!-- &#8644; -->
								<img src="./assets/icons/swap_calls.svg" alt="" srcset="">
							</button>

							<!-- End Station -->
							<div class="form-group">
								<label for="endStation" data-i18n="pages.home.sidebar.findroute.endStation">To</label>
								<input type="text" id="endStation" data-i18n-placeholder="pages.home.sidebar.findroute.endPlaceholder" placeholder="Enter end station" list="stationList" value="Anand Vihar" autocomplete="off" required>
							</div>

							<!-- Shared Datalist -->
							<datalist id="stationList"></datalist>
							
							<!-- Actions -->
							<div class="form-actions">
								<button type="submit" data-i18n="pages.home.sidebar.findroute.findRoute">Find Route</button>
								<button type="reset" data-i18n="pages.home.sidebar.findroute.resetForm">Reset</button>
							</div>
							
						</fieldset>
					</form>
					<div id="journeyDetails">
						<section class="route-priority">
							 <div class="priority-header">
                                <p data-i18n="pages.home.sidebar.findroute.priority">Priority</p>
                                <div class="sharebtn">
                                    <button type="button" id="shareRouteBtn" aria-label="Share Route" data-i18n-title="pages.home.sidebar.findroute.shareModal.title" title="Share Route">
                                        <span class="icon share-icon" aria-hidden="true"></span>
                                    </button>
                                </div>
                            </div>
							<div class="switch-slider-track">
								<!-- इनपुट्स को ट्रैक के शीर्ष स्तर पर रखें ताकि CSS सिबलिंग सिलेक्टर्स काम कर सकें -->
								<input type="radio" id="priority-fastest" name="routeType" value="fastest" checked>
								<input type="radio" id="priority-leastTransfers" name="routeType" value="leastTransfers">
								
								<!-- शॉर्टेस्ट (Runner Icon) लेबल -->
								<label class="switch-slider-label" for="priority-fastest">
									<img src="assets/icons/runer.svg" alt="Shortest" class="switch-icon">
									<span data-i18n="pages.home.sidebar.findroute.shortest">Shortest</span>
								</label>
								
								<!-- कम इंटरचेंज (Relax Icon) लेबल -->
								<label class="switch-slider-label" for="priority-leastTransfers">
									<img src="assets/icons/relex.svg" alt="Less Interchange" class="switch-icon">
									<span data-i18n="pages.home.sidebar.findroute.lessInterchange">Less Interchange</span>
								</label>
								
								<!-- सफ़ेद स्लाइडिंग थम्ब -->
								<div class="switch-slider-thumb"></div>
							</div>
						</section>
						<!-- <section class="quickoverview">
							<div class="total_station"><span class="value">00</span>stations</div>

							<div class="distance"><span class="value">00</span> Km</div>
						</section> -->
						<section class="route-overview" aria-labelledby="route-overview-heading" aria-live="polite">
							<h2 id="route-overview-heading" data-i18n="pages.home.sidebar.findroute.journeyDetails">Journey Details</h2>
						</section>
					</div>
				</section>
			</aside>

		</div>

		<section class="map-section">
			<section class="mapContainer" aria-label="Interactive Metro Map" role="img"></section>

                <span class="speed-number" id="speed-value">0.0</span>

            </div>

		<nav class="floating-nav-wrapper" id="floating-nav-wrapper" aria-label="Floating Navigation Wrapper">
            <!-- 7. Inline SVG Mask that creates a physically transparent notch with smooth curves -->
            <svg width="0" height="0" style="position: absolute;">
                <defs>
                    <mask id="nav-mask" maskContentUnits="userSpaceOnUse">
                        <!-- White background to keep the rest of the navbar visible -->
                        <rect width="1000" height="70" fill="white"  />
                        
                        <!-- Black smooth S-curve notch path to cut out a transparent hole. 
                                We will shift it horizontally in JavaScript -->
                        <path id="cutout-path" d="M -45 0 C -33 0, -28 32, 0 32 C 28 32, 33 0, 45 0 Z" fill="black" transform="translate(50, 0)" />
                    </mask>
                </defs>
            </svg>

	</main>
  

   <div id="app-footer"></div>
	
    <!-- =========================================================================
	   SHARE ROUTE CUSTOM MODAL (Desktop & Fallback Popup)
	========================================================================= -->
	<div id="shareModal" class="share-modal-backdrop" aria-hidden="true">
		<div class="share-modal-card" role="dialog" aria-labelledby="shareModalTitle">
			<!-- Modal Header -->
			<header class="share-modal-header">
				<h3 id="shareModalTitle" data-i18n="pages.home.sidebar.findroute.shareModal.title">Share Route</h3>
				<button type="button" id="closeShareModal" class="close-modal-btn" aria-label="Close">
					<span class="icon close-icon" aria-hidden="true">✕</span>
				</button>
			</header>

			<!-- Modal Body: Route Overview Preview -->
			<div class="share-modal-body">
				<div class="share-route-preview">
					<div class="preview-header">
						<span id="sharePreviewFrom" class="preview-station">Start</span>
						<span class="preview-arrow">➔</span>
						<span id="sharePreviewTo" class="preview-station">Destination</span>
					</div>
					<div class="preview-metrics">
						<span id="sharePreviewDist">0.0 km</span> • 
						<span id="sharePreviewTime">0 min</span> • 
						<span id="sharePreviewFare">₹0</span>
					</div>
				</div>

				<!-- Share Actions Grid -->
				<p class="share-options-title">Select Share Option:</p>
				<div class="share-options-grid">
					<button type="button" id="shareWhatsAppBtn" class="share-opt-btn whatsapp-opt">
						<span class="share-opt-icon">💬</span>
						<span>WhatsApp</span>
					</button>

					<button type="button" id="shareTelegramBtn" class="share-opt-btn telegram-opt">
						<span class="share-opt-icon">✈️</span>
						<span>Telegram</span>
					</button>

					<button type="button" id="shareSmsBtn" class="share-opt-btn sms-opt">
						<span class="share-opt-icon">📱</span>
						<span>SMS</span>
					</button>

					<button type="button" id="copyShareUrlBtn" class="share-opt-btn copy-url-opt">
						<span class="share-opt-icon">🔗</span>
						<span>Copy Link</span>
					</button>

					<button type="button" id="copyShareTextBtn" class="share-opt-btn copy-text-opt">
						<span class="share-opt-icon">📋</span>
						<span>Copy Details</span>
					</button>
				</div>
			</div>
		</div>
	</div>

	<!-- Floating Toast Notification Container -->
	<div id="shareToast" class="share-toast-msg" aria-live="polite"></div>
